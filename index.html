<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>김&박 선교사의 태국 선교 이야기</title>

<link rel="stylesheet" as="style" crossorigin

  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

<link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">

<style>

  :root{

    --bg:#FDFCF8;

    --bg-alt:#F7F3EA;

    --navy:#0B3C4D;

    --navy-deep:#082530;

    --sky:#2E9FD6;

    --sky-soft:#E4F2FA;

    --orange:#FF9233;

    --orange-deep:#E87A1B;

    --ink:#1E2A2E;

    --ink-soft:#697779;

    --line:#E9E3D6;

  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{

    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;

    background:var(--bg);

    color:var(--ink);

    -webkit-font-smoothing:antialiased;

    overflow-x:hidden;

  }

  a{text-decoration:none;color:inherit;}

  img{max-width:100%;display:block;}

  button{font-family:inherit;}

  ::selection{background:var(--orange);color:#fff;}

  @media (prefers-reduced-motion: reduce){

    *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important;}

  }



  /* ===== Nav ===== */

  header{

    position:fixed;top:0;left:0;right:0;z-index:200;

    padding:20px 5vw;

    display:flex;align-items:center;justify-content:space-between;

    background:rgba(8,37,48,.55);

    backdrop-filter:blur(14px);

    -webkit-backdrop-filter:blur(14px);

    border-bottom:1px solid rgba(255,255,255,.14);

    transition:padding .3s ease, box-shadow .3s ease, background .3s ease;

  }

  header.scrolled{

    padding:13px 5vw;

    background:rgba(255,255,255,.94);

    border-bottom:1px solid rgba(11,60,77,.08);

    box-shadow:0 4px 24px rgba(11,60,77,.08);

  }

  .logo-text{

    font-weight:800;font-size:19px;color:#fff;letter-spacing:-.01em;

    display:flex;align-items:center;gap:10px;transition:color .3s ease;

  }

  header.scrolled .logo-text{color:var(--navy);}

  .logo-text .nav-logo-img{height:36px;width:auto;flex-shrink:0;transition:height .3s ease;}

  header.scrolled .logo-text .nav-logo-img{height:30px;}

  .logo-text .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);flex-shrink:0;}



  nav.main-nav{display:flex;align-items:center;gap:42px;}

  nav.main-nav a{

    font-size:17px;font-weight:600;color:#fff;position:relative;padding:4px 0;

    transition:color .25s;

  }

  header.scrolled nav.main-nav a{color:var(--navy);}

  nav.main-nav a::after{

    content:"";position:absolute;left:0;bottom:-2px;width:0;height:2px;background:var(--orange);

    transition:width .25s ease;

  }

  nav.main-nav a:hover{color:var(--orange);}

  header.scrolled nav.main-nav a:hover{color:var(--navy);}

  nav.main-nav a:hover::after{width:100%;}



  .btn-donate{

    background:var(--orange);color:#fff;padding:12px 28px;border-radius:100px;

    font-weight:700;font-size:15.5px;box-shadow:0 8px 20px rgba(255,146,51,.4);

    border:none;cursor:pointer;transition:transform .22s ease, box-shadow .22s ease, background .22s ease;

  }

  .btn-donate:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(255,146,51,.45);background:var(--orange-deep);}



  /* ===== Donate Modal ===== */

  .donate-overlay{

    position:fixed;inset:0;z-index:300;background:rgba(8,30,38,.55);

    display:flex;align-items:center;justify-content:center;padding:24px;

    opacity:0;pointer-events:none;transition:opacity .25s ease;

  }

  .donate-overlay.open{opacity:1;pointer-events:auto;}

  .donate-modal{

    background:#fff;border-radius:22px;max-width:420px;width:100%;padding:32px 28px 28px;

    box-shadow:0 30px 60px rgba(0,0,0,.3);position:relative;

    transform:translateY(16px);transition:transform .25s ease;

  }

  .donate-overlay.open .donate-modal{transform:translateY(0);}

  .donate-modal h3{font-size:19px;font-weight:800;color:var(--navy);margin-bottom:4px;}

  .donate-modal .sub{font-size:13px;color:var(--ink-soft);margin-bottom:22px;}

  .donate-close{

    position:absolute;top:18px;right:18px;width:30px;height:30px;border-radius:50%;border:none;

    background:var(--bg-alt);cursor:pointer;display:flex;align-items:center;justify-content:center;

    font-size:16px;color:var(--ink-soft);transition:background .2s;

  }

  .donate-close:hover{background:var(--sand-line);}

  .donate-account{

    background:var(--bg-alt);border-radius:14px;padding:16px 18px;margin-bottom:14px;

  }

  .donate-account .tag{font-size:11px;font-weight:700;color:var(--orange-deep);letter-spacing:.04em;margin-bottom:6px;display:block;}

  .donate-account .num{font-size:15.5px;font-weight:700;color:var(--navy);margin-bottom:2px;}

  .donate-account .note{font-size:12.8px;color:var(--ink-soft);line-height:1.6;}

  .donate-copy-btn{

    margin-top:8px;background:var(--navy);color:#fff;border:none;border-radius:8px;

    padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;transition:background .2s;

  }

  .donate-copy-btn:hover{background:var(--navy-deep);}



  .menu-toggle{display:none;background:none;border:none;cursor:pointer;padding:6px;z-index:210;}



  /* ===== Back to top (floating, follows current section) ===== */

  #backToTop{

    position:fixed;right:22px;bottom:22px;z-index:190;

    width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;

    background:var(--navy);color:#fff;box-shadow:0 8px 22px rgba(11,60,77,.28);

    display:flex;align-items:center;justify-content:center;

    opacity:0;pointer-events:none;transform:translateY(12px);

    transition:opacity .25s ease, transform .25s ease, background .2s ease;

  }

  #backToTop.show{opacity:1;pointer-events:auto;transform:translateY(0);}

  #backToTop:hover{background:var(--orange);}

  #backToTop svg{width:20px;height:20px;}



  /* ===== 카테고리 더보기 링크 ===== */

  .wall-more{

    display:inline-flex;align-items:center;gap:6px;margin-top:18px;

    font-size:13.5px;font-weight:700;color:var(--navy);cursor:pointer;

    padding:8px 4px;transition:color .2s;

  }

  .wall-more:hover{color:var(--orange);}



  /* ===== 검색창 ===== */

  .site-search{

    max-width:420px;margin:22px auto 0;position:relative;

  }

  .site-search input{

    width:100%;padding:12px 44px 12px 16px;border-radius:100px;border:1px solid var(--line);

    font-size:14px;font-family:inherit;background:#fff;color:var(--ink);

  }

  .site-search input:focus{outline:none;border-color:var(--orange);}

  .site-search svg{

    position:absolute;right:16px;top:50%;transform:translateY(-50%);

    width:18px;height:18px;stroke:var(--ink-soft);pointer-events:none;

  }

  .site-search-results{

    max-width:640px;margin:14px auto 0;text-align:left;display:none;

    background:#fff;border-radius:16px;box-shadow:0 10px 26px rgba(11,60,77,.1);overflow:hidden;

  }

  .site-search-results.open{display:block;}

  .sr-row{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s;}

  .sr-row:last-child{border-bottom:none;}

  .sr-row:hover{background:var(--bg-alt);}

  .sr-thumb{width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--bg-alt);flex-shrink:0;}

  .sr-thumb img{width:100%;height:100%;object-fit:cover;}

  .sr-text strong{display:block;font-size:13.5px;color:var(--navy);}

  .sr-text span{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

  .sr-empty{padding:16px;font-size:13px;color:var(--ink-soft);text-align:center;}

<div class="donate-overlay" id="donateOverlay">
  <div class="donate-modal">
    <button class="donate-close" id="donateClose" aria-label="닫기">✕</button>
    <h3>선교 동역 안내</h3>
    <p class="sub">작은 정성이 이산 땅의 복음의 씨앗이 됩니다.</p>
    <div class="donate-account">
      <span class="tag">1. 개인 후원</span>
      <div class="num">농협 351-0435-4009-73 (김영진)</div>
      <button class="donate-copy-btn" data-copy="351-0435-4009-73">계좌번호 복사</button>
    </div>
    <div class="donate-account">

      <div class="note">추후 파송식 일정과 맞춰서 열릴 예정입니다.</div>
    </div>
  </div>
</div>

    <h1 class="calligraphy" data-i18n-html="hero.title">복음과 사랑으로<br>태국선교를 품go.</h1>
    <p class="hero-verse">
      "밤에 환상이 바울에게 보이니 마게도냐 사람 하나가 서서 그에게 청하여 이르되 마게도냐로 건너와서 우리를 도우라 하거늘,
      바울이 그 환상을 보았을 때 우리가 곧 마게도냐로 떠나기를 힘쓰니 이는 하나님이 저 사람에게 복음을 전하라고 우리를 부르신 줄로 인정함이러라"
      <cite>사도행전 16:9–10</cite>

<script>
  let visionPost = null;
  function lockBodyScroll(){ document.body.style.overflow = 'hidden'; }
  function unlockBodyScroll(){ document.body.style.overflow = ''; }
  // ▼▼▼ 아래 SCRIPT_URL 자리에 배포받은 웹 앱 주소를 붙여넣으면 실제 저장/메일 발송이 작동합니다.
  const SUBSCRIBE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwBcVV1SsX6RzCK-iSV8ygnvBd0AqyHnMLeLXajNp8i9AiRfEkObBocVQyiCZK7bJRM9w/exec';
  const header = document.getElementById('siteHeader');
  const nav = document.getElementById('mainNav');
  const toggle = document.getElementById('menuToggle');

  window.addEventListener('scroll', () => {
    header.classList.toggle('scrolled', window.scrollY > 40);
  });

  // ===== 맨 위로 가기 버튼 (현재 보고 있는 화면을 따라다니는 플로팅 버튼) =====
  const backToTopBtn = document.getElementById('backToTop');
  if (backToTopBtn) {
    window.addEventListener('scroll', () => {
      backToTopBtn.classList.toggle('show', window.scrollY > 480);
    }, { passive: true });
    backToTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  // ===== 다국어 전환 (틀 + 주요 UI 영어 번역) =====
  // 참고: 아래 en 객체에 data-i18n="키" 와 짝지어 문장을 추가하면 얼마든지 번역 범위를 넓힐 수 있습니다.
  // 단, 노션에서 불러오는 글(제목/본문)은 자동 번역되지 않습니다 — 이 부분은 별도의 번역 API 연동이 필요합니다.
  const i18nDict = {
    en: {
      'nav.about': 'About', 'nav.profile': 'Profile', 'nav.journey': 'Our Calling',
      'nav.training': 'Training', 'nav.mission': 'Mission Stories', 'nav.daily': 'Daily Life',
      'nav.letter': 'Prayer Letters', 'nav.donate': 'Support Us',
      'hero.eyebrow': 'Answering God\u2019s call to serve in Thailand',
      'hero.title': 'Sharing the Gospel<br>and love in Thailand.',
      'hero.visionBtn': 'Read our vision statement',
      'timeline.title': 'Our Journey', 'timeline.sub': 'Zoom in/out or drag sideways to explore.',
      'map.title': 'Field Map', 'map.sub': 'Key places where we serve on the field.',
      'prayer.label': 'partners have prayed together with us', 'prayer.btn': '\ud83d\ude4f I prayed too',
      'gallery.title': 'Missionary & Ministry Stories', 'gallery.sub': 'Stories from under the Isan sky in Thailand.',
      'guestbook.title': 'Messages of Blessing', 'guestbook.sub': 'Leave a warm word of blessing for the missionary family.',
    }
  };
  let currentLang = localStorage.getItem('siteLang') || 'ko';
  const koOriginals = new Map(); // 한국어 원문을 저장해 두었다가 되돌릴 때 사용
  function applyLang(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (!koOriginals.has(el)) koOriginals.set(el, el.textContent);
      el.textContent = (lang === 'en' && i18nDict.en[key]) ? i18nDict.en[key] : koOriginals.get(el);
    });
    document.querySelectorAll('[data-i18n-html]').forEach(el => {
      const key = el.getAttribute('data-i18n-html');
      if (!koOriginals.has(el)) koOriginals.set(el, el.innerHTML);
      el.innerHTML = (lang === 'en' && i18nDict.en[key]) ? i18nDict.en[key] : koOriginals.get(el);
    });
    try { localStorage.setItem('siteLang', lang); } catch (e) {}
  }
  const langSwitch = document.getElementById('langSwitch');
  if (langSwitch) {
    langSwitch.value = currentLang;
    langSwitch.addEventListener('change', () => applyLang(langSwitch.value));
    applyLang(currentLang);
  }

  // ===== 확대/축소 가능한 발자취 타임라인 =====
  // TODO: 아래 배열의 날짜/제목/설명을 실제 사역 발자취에 맞게 자유롭게 수정·추가하세요.
  const timelineMilestones = [
    { date: '', title: '', desc: '' },
    { date: '', title: '', desc: '' },
    { date: '', title: '', desc: '' },
    { date: '', title: '', desc: '' },
    { date: '', title: '', desc: '' },
  ];
  (function initTimeline() {
    const track = document.getElementById('timelineTrack');
    const line = document.getElementById('timelineLine');
    if (!track || !line) return;
    line.innerHTML = timelineMilestones.map(m => `
      <div class="timeline-item">
        <div class="timeline-dot"></div>
        <div class="tl-date">${escapeHtml(m.date)}</div>
        <div class="tl-title">${escapeHtml(m.title)}</div>
        <div class="tl-desc">${escapeHtml(m.desc)}</div>
      </div>
    `).join('');

    let zoom = 1;
    function applyZoom() {
      const gap = Math.round(60 * zoom);
      const w = Math.round(160 * zoom);
      line.style.setProperty('--tl-gap', gap + 'px');
      line.style.setProperty('--tl-w', w + 'px');
    }
    applyZoom();
    document.getElementById('timelineZoomIn')?.addEventListener('click', () => { zoom = Math.min(1.8, zoom + 0.2); applyZoom(); });
    document.getElementById('timelineZoomOut')?.addEventListener('click', () => { zoom = Math.max(0.6, zoom - 0.2); applyZoom(); });

    // 좌우로 드래그해서 이동
    let isDown = false, startX = 0, scrollStart = 0;
    track.addEventListener('mousedown', (e) => {
      isDown = true; track.classList.add('dragging');
      startX = e.pageX; scrollStart = track.scrollLeft;
    });
    window.addEventListener('mouseup', () => { isDown = false; track.classList.remove('dragging'); });
    window.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      track.scrollLeft = scrollStart - (e.pageX - startX);
    });
  })();

  // ===== 글로벌 기도 카운터 =====
  (function initPrayerCounter() {
    const numEl = document.getElementById('prayerCountNum');
    const btn = document.getElementById('prayerBtn');
    if (!numEl || !btn) return;
    if (!SUBSCRIBE_SCRIPT_URL || SUBSCRIBE_SCRIPT_URL.indexOf('PASTE_YOUR') !== -1) {
      numEl.textContent = '0';
      return;
    }
    fetch(SUBSCRIBE_SCRIPT_URL + '?type=prayer-count')
      .then(res => res.json())
      .then(data => { numEl.textContent = (data.count || 0).toLocaleString(); })
      .catch(() => { numEl.textContent = '0'; });

    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      btn.disabled = true;
      const prevText = btn.textContent;
      btn.textContent = '기도가 전달되었어요 🙏';
      // 화면에는 즉시 반영
      const cur = parseInt((numEl.textContent || '0').replace(/,/g, ''), 10) || 0;
      numEl.textContent = (cur + 1).toLocaleString();
      // 서버에도 실제로 반영 (중복 클릭 방지를 위해 이번 기기에서 한 번만)
      try { localStorage.setItem('prayedAt', String(Date.now())); } catch (e) {}
      const formData = new FormData();
      formData.append('type', 'prayer-count');
      fetch(SUBSCRIBE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: formData })
        .catch(() => { /* 이미 화면에는 반영되어 있으므로 무시 */ });
    });

    // 오늘 이미 눌렀다면 버튼 비활성화 (같은 기기에서 중복 클릭만 가볍게 방지)
    try {
      const last = parseInt(localStorage.getItem('prayedAt') || '0', 10);
      if (last && Date.now() - last < 1000 * 60 * 60 * 12) {
        btn.disabled = true;
        btn.textContent = '오늘은 이미 기도해주셨어요 🙏';
      }
    } catch (e) {}
  })();

  toggle.addEventListener('click', () => nav.classList.toggle('open'));
  nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => nav.classList.remove('open')));

  // donate modal
  const donateOverlay = document.getElementById('donateOverlay');
  const donateClose = document.getElementById('donateClose');
  document.querySelectorAll('.btn-donate').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      donateOverlay.classList.add('open');
      lockBodyScroll();
    });
  });
  donateClose.addEventListener('click', () => { donateOverlay.classList.remove('open'); unlockBodyScroll(); });
  donateOverlay.addEventListener('click', (e) => { if (e.target === donateOverlay) { donateOverlay.classList.remove('open'); unlockBodyScroll(); } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { donateOverlay.classList.remove('open'); unlockBodyScroll(); } });

  // profile modal (프로필 — 클릭 시에만 뜨는 팝업, 메인 화면에는 노출되지 않음)
  const profileOverlay = document.getElementById('profileOverlay');
  const profileClose = document.getElementById('profileClose');
  const navProfile = document.getElementById('navProfile');
  if (navProfile) {
    navProfile.addEventListener('click', (e) => {
      e.preventDefault();
      profileOverlay.classList.add('open');
      lockBodyScroll();
    });
  }
  profileClose.addEventListener('click', () => { profileOverlay.classList.remove('open'); unlockBodyScroll(); });
  profileOverlay.addEventListener('click', (e) => { if (e.target === profileOverlay) { profileOverlay.classList.remove('open'); unlockBodyScroll(); } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { profileOverlay.classList.remove('open'); unlockBodyScroll(); } });
  const profileSupportLink = document.getElementById('profileSupportLink');
  if (profileSupportLink) {
    profileSupportLink.addEventListener('click', () => {
      profileOverlay.classList.remove('open');
      unlockBodyScroll();
      document.getElementById('support')?.scrollIntoView({ behavior: 'smooth' });
    });
  }

  // 비전검증문 (노션 "비전검증문" 카테고리와 연결)
  function openVisionDoc() {
    if (visionPost) {
      openPostLightbox(visionPost);
    } else {
      alert('비전검증문이 아직 등록되지 않았습니다.');
    }
  }
  const visionBadge = document.getElementById('visionBadge');
  const visionBtn = document.getElementById('visionBtn');
  if (visionBadge) {
    visionBadge.addEventListener('mouseenter', () => { if (visionPost) prefetchPostDetail(visionPost); });
    visionBadge.addEventListener('click', openVisionDoc);
  }
  if (visionBtn) {
    visionBtn.addEventListener('mouseenter', () => { if (visionPost) prefetchPostDetail(visionPost); });
    visionBtn.addEventListener('click', openVisionDoc);
  }
  document.querySelectorAll('.donate-copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const text = btn.getAttribute('data-copy');
      navigator.clipboard?.writeText(text).then(() => {
        const original = btn.textContent;
        btn.textContent = '복사됨!';
        setTimeout(() => { btn.textContent = original; }, 1500);
      });
    });
  });

  // newsletter subscribe -> Google Sheets + email backend (via Apps Script Web App)

  const subscribeForm = document.getElementById('subscribeForm');
  if (subscribeForm) {
    subscribeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const emailInput = document.getElementById('subscribeEmail');
      const email = emailInput.value.trim();
      if (!email) return;

      // 1) 화면에 바로 표시 (즉시 피드백)
      const note = document.getElementById('subscribeNote');
      note.textContent = `✓ ${email} 님, 구독 신청이 완료되었습니다!`;
      note.classList.add('confirmed');

      const list = document.getElementById('subscriberList');
      const li = document.createElement('li');
      li.innerHTML = `<span class="check">✓</span> ${email}`;
      list.prepend(li);

      emailInput.value = '';

      // 2) 실제 저장 + 알림 메일 발송 (Google Apps Script 백엔드로 전송)
      if (SUBSCRIBE_SCRIPT_URL && SUBSCRIBE_SCRIPT_URL.indexOf('PASTE_YOUR') === -1) {
        const formData = new FormData();
        formData.append('email', email);
        fetch(SUBSCRIBE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors', // Apps Script 응답을 읽지는 않지만 전송은 정상적으로 이루어집니다.
          body: formData
        }).catch(() => { /* 네트워크 오류가 나도 위 화면 표시는 이미 되어 있으므로 무시 */ });
      }
    });
  }

  // gallery reveal
  const cardObserver = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting){ e.target.classList.add('show'); cardObserver.unobserve(e.target); } });
  }, { threshold: 0.15 });
  document.querySelectorAll('.g-card').forEach(el => cardObserver.observe(el));

  // ===== Notion 연동 갤러리 (선교 이야기 / 일상 이야기) =====
  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    if (isNaN(d)) return dateStr;
    return `${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,'0')}. ${String(d.getDate()).padStart(2,'0')}`;
  }

  let allPosts = []; // 노션에서 불러온 전체 글 목록 (검색 · 카테고리 전체보기 · 이어보기에서 재사용 — 추가 API 호출 없음)
  const detailCache = new Map(); // 이미 불러온 글의 본문/사진을 저장해서 재클릭 시 즉시 표시

  function prefetchPostDetail(post) {
    if (!post.id || detailCache.has(post.id)) return;
    if (!SUBSCRIBE_SCRIPT_URL || SUBSCRIBE_SCRIPT_URL.indexOf('PASTE_YOUR') !== -1) return;
    detailCache.set(post.id, 'loading'); // 중복 요청 방지용 임시 표시
    fetch(SUBSCRIBE_SCRIPT_URL + '?type=notion-content&id=' + encodeURIComponent(post.id))
      .then(res => res.json())
      .then(data => {
        detailCache.set(post.id, data);
        // 본문 사진도 실제로 미리 다운로드해서 브라우저에 캐시해둠 (클릭 시 즉시 표시)
        (data.images || []).forEach(src => { const im = new Image(); im.src = src; });
      })
      .catch(() => { detailCache.delete(post.id); });
  }

  function autoPrefetchAll(postLists) {
    // 화면에 보이는 글들을 페이지 로드 직후 순서대로 조금씩 미리 불러옴 (서버에 한꺼번에 몰리지 않도록 간격을 둠)
    const all = [].concat(...postLists).filter(p => p && p.id);
    all.forEach((post, i) => {
      setTimeout(() => prefetchPostDetail(post), i * 250);
    });
  }

  function renderLane(elId, posts) {
    const el = document.getElementById(elId);
    if (!el) return;
    el.innerHTML = '';
    if (!posts.length) {
      el.innerHTML = '<p class="lane-empty">아직 등록된 소식이 없습니다.</p>';
      return;
    }
    posts.slice(0, 24).forEach((post, i) => {
      const card = document.createElement('div');
      card.className = 'lane-card';
      card.style.animationDelay = (Math.min(i, 12) * 0.04) + 's';

      const thumb = document.createElement('div');
      thumb.className = 'lane-thumb';
      if (post.images && post.images[0]) {
        const img = document.createElement('img');
        img.src = post.images[0];
        img.alt = post.title || '';
        img.loading = 'eager';
        thumb.appendChild(img);
      } else if (post.video) {
        const img = document.createElement('img');
        img.src = 'https://img.youtube.com/vi/' + post.video + '/hqdefault.jpg';
        img.alt = post.title || '';
        thumb.appendChild(img);
      }
      addVideoBadge(thumb, post);
      card.appendChild(thumb);

      const body = document.createElement('div');
      body.className = 'lane-body';
      body.innerHTML = `
        <div class="lane-date">${formatDate(post.date)}</div>
        <h4>${escapeHtml(post.title)}</h4>
        <p class="lane-excerpt">${escapeHtml(post.summary || '')}</p>
      `;
      card.appendChild(body);

      // 마우스를 올리거나 터치하는 순간 미리 불러오기 시작 → 클릭했을 때 바로 뜸
      card.addEventListener('mouseenter', () => prefetchPostDetail(post));
      card.addEventListener('touchstart', () => prefetchPostDetail(post), { passive: true });
      card.addEventListener('click', () => openPostLightbox(post));
      el.appendChild(card);
    });
  }

  const postLightboxOverlay = document.getElementById('postLightboxOverlay');
  const postLightboxVideo = document.getElementById('postLightboxVideo');
  const postLightboxVideoFrame = document.getElementById('postLightboxVideoFrame');
  const postLightboxImages = document.getElementById('postLightboxImages');
  const postLightboxDate = document.getElementById('postLightboxDate');
  const postLightboxTitle = document.getElementById('postLightboxTitle');
  const postLightboxSummary = document.getElementById('postLightboxSummary');
  const postLightboxClose = document.getElementById('postLightboxClose');

  // ===== 유튜브 영상 카드: 썸네일에 재생 버튼 오버레이를 붙여줌 (post.video 값이 있을 때만) =====
  function addVideoBadge(thumbEl, post) {
    if (!thumbEl || !post || !post.video) return;
    const badge = document.createElement('div');
    badge.className = 'video-play-badge';
    badge.innerHTML = '<svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="12" r="11" fill="rgba(8,30,38,.55)"/><path d="M10 8l6 4-6 4V8z"/></svg>';
    thumbEl.appendChild(badge);
  }

  // ===== 글별 공유하기 버튼 =====
  function buildShareUrl(post) {
    // 노션 글은 별도 URL이 없으므로 홈페이지 주소 + 글 제목으로 공유 링크를 구성합니다.
    const base = location.origin + location.pathname;
    return post && post.id ? base + '#post-' + encodeURIComponent(post.id) : base;
  }
  function renderShareRow(post) {
    const row = document.getElementById('postShareRow');
    if (!row) return;
    row.innerHTML = '';
    const shareUrl = buildShareUrl(post);
    const shareTitle = post.title || '태국 선교 이야기';

    // 모바일에서는 OS 공유창(Web Share API)이 뜨며, 설치된 카카오톡으로도 바로 공유할 수 있습니다.
    if (navigator.share) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'post-share-btn';
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6l6.8-3.2M8.6 13.4l6.8 3.2"/></svg> 공유하기';
      btn.addEventListener('click', () => {
        navigator.share({ title: shareTitle, text: shareTitle, url: shareUrl }).catch(() => {});
      });
      row.appendChild(btn);
    } else {
      const fb = document.createElement('a');
      fb.className = 'post-share-btn';
      fb.href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(shareUrl);
      fb.target = '_blank';
      fb.rel = 'noopener noreferrer';
      fb.innerHTML = 'Facebook 공유';
      row.appendChild(fb);
    }

    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'post-share-btn';
    copyBtn.innerHTML = '🔗 링크 복사';
    copyBtn.addEventListener('click', () => {
      navigator.clipboard?.writeText(shareUrl).then(() => {
        copyBtn.classList.add('copied');
        const orig = copyBtn.innerHTML;
        copyBtn.innerHTML = '복사됨!';
        setTimeout(() => { copyBtn.classList.remove('copied'); copyBtn.innerHTML = orig; }, 1500);
      });
    });
    row.appendChild(copyBtn);
  }

  function applyPostDetail(post, data) {
    postLightboxSummary.textContent = (data.content && data.content.trim()) ? data.content : (post.summary || '');
    if (!post.video && data.images && data.images.length) {
      data.images.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.alt = post.title || '';
        postLightboxImages.appendChild(img);
      });
    }
  }

  function openPostLightbox(post) {
    postLightboxImages.innerHTML = '';
    if (post.video) {
      // 영상 글: 이미지 대신 유튜브 임베드를 보여줌
      postLightboxVideo.style.display = '';
      postLightboxVideoFrame.src = 'https://www.youtube.com/embed/' + encodeURIComponent(post.video);
      postLightboxImages.style.display = 'none';
    } else {
      postLightboxVideo.style.display = 'none';
      postLightboxVideoFrame.src = '';
      postLightboxImages.style.display = '';
      (post.images || []).forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.alt = post.title || '';
        postLightboxImages.appendChild(img);
      });
    }
    postLightboxDate.textContent = formatDate(post.date);
    postLightboxTitle.textContent = post.title || '';
    postLightboxSummary.textContent = post.summary || '';
    renderShareRow(post);
    postLightboxOverlay.classList.add('open');
    lockBodyScroll();
    renderPostContinue(post);

    // 노션 페이지의 전체 본문 내용 + 본문에 넣은 추가 사진 — 이미 미리 불러와 둔 게 있으면 바로 표시(버퍼링 없음)
    const cached = post.id ? detailCache.get(post.id) : null;
    if (cached && cached !== 'loading') {
      applyPostDetail(post, cached);
    } else if (post.id && SUBSCRIBE_SCRIPT_URL && SUBSCRIBE_SCRIPT_URL.indexOf('PASTE_YOUR') === -1) {
      postLightboxSummary.textContent = (post.summary ? post.summary + '\n\n' : '') + '본문을 불러오는 중...';
      fetch(SUBSCRIBE_SCRIPT_URL + '?type=notion-content&id=' + encodeURIComponent(post.id))
        .then(res => res.json())
        .then(data => {
          detailCache.set(post.id, data);
          (data.images || []).forEach(src => { const im = new Image(); im.src = src; });
          applyPostDetail(post, data);
        })
        .catch(() => {
          detailCache.delete(post.id);
          postLightboxSummary.textContent = post.summary || '';
        });
    }
  }
  postLightboxClose.addEventListener('click', () => { postLightboxOverlay.classList.remove('open'); unlockBodyScroll(); });
  postLightboxOverlay.addEventListener('click', (e) => { if (e.target === postLightboxOverlay) { postLightboxOverlay.classList.remove('open'); unlockBodyScroll(); } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { postLightboxOverlay.classList.remove('open'); unlockBodyScroll(); } });

  // 페이지 로드 시 노션에서 소식 불러오기 (백엔드가 노션 API를 대신 호출해줌) — 각 카테고리별 최신 3개만 표시
  if (SUBSCRIBE_SCRIPT_URL && SUBSCRIBE_SCRIPT_URL.indexOf('PASTE_YOUR') === -1) {
    fetch(SUBSCRIBE_SCRIPT_URL + '?type=notion')
      .then(res => res.json())
      .then(data => {
        const posts = data.posts || [];
        allPosts = posts; // 검색/카테고리 전체보기/이어보기에서 사용
        const journeyPosts = posts.filter(p => p.category === '선교사의 부르심').slice(0, 3);
        const trainingPosts = posts.filter(p => p.category === '선교사 훈련 과정').slice(0, 3);
        const missionPosts = posts.filter(p => p.category === '선교 이야기').slice(0, 3);
        const dailyPosts = posts.filter(p => p.category === '일상 이야기').slice(0, 3);
        const letterPosts = posts.filter(p => p.category === '기도 편지' || p.category === '기도편지');
        renderLane('laneJourney', journeyPosts);
        renderLane('laneTraining', trainingPosts);
        renderLane('laneMission', missionPosts);
        renderLane('laneDaily', dailyPosts);
        renderPrayerLetters(letterPosts);
        visionPost = posts.find(p => p.category === '비전검증문' || p.category === '비전 검증문') || null;
        handleGalleryHash(); // 주소창에 #gallery/카테고리명 이 있으면 바로 전체보기를 열어줌

        // 화면에 보이는 글들을 페이지 로드 직후 순서대로 미리 불러와서 클릭 시 버퍼링 없이 뜨도록 함
        autoPrefetchAll([
          journeyPosts, trainingPosts, missionPosts, dailyPosts, letterPosts,
          visionPost ? [visionPost] : []
        ]);
      })
      .catch(() => {
        renderLane('laneJourney', []);
        renderLane('laneTraining', []);
        renderLane('laneMission', []);
        renderLane('laneDaily', []);
        renderPrayerLetters([]);
      });
  } else {
    renderLane('laneJourney', []);
    renderLane('laneTraining', []);
    renderLane('laneMission', []);
    renderLane('laneDaily', []);
    renderPrayerLetters([]);
  }

  // ===== 카테고리 전체보기 (가상 페이지) — 이미 불러온 allPosts를 재사용, 추가 API 호출 없음 =====
  const categoryOverlay = document.getElementById('categoryOverlay');
  const categoryClose = document.getElementById('categoryClose');
  const categoryTitle = document.getElementById('categoryTitle');
  const categorySub = document.getElementById('categorySub');
  const categoryGrid = document.getElementById('categoryGrid');
  let currentCategoryName = null;

  function openCategoryOverlay(catName) {
    currentCategoryName = catName;
    const list = allPosts.filter(p => p.category === catName);
    categoryTitle.textContent = catName;
    categorySub.textContent = `총 ${list.length}개의 이야기`;
    categoryGrid.innerHTML = '';
    if (!list.length) {
      categoryGrid.innerHTML = '<p class="lane-empty">아직 등록된 이야기가 없습니다.</p>';
    } else {
      list.forEach(post => {
        const card = document.createElement('div');
        card.className = 'lane-card';
        const thumb = document.createElement('div');
        thumb.className = 'lane-thumb';
        if (post.images && post.images[0]) {
          const img = document.createElement('img');
          img.src = post.images[0];
          img.alt = post.title || '';
          thumb.appendChild(img);
        } else if (post.video) {
          const img = document.createElement('img');
          img.src = 'https://img.youtube.com/vi/' + post.video + '/hqdefault.jpg';
          img.alt = post.title || '';
          thumb.appendChild(img);
        }
        addVideoBadge(thumb, post);
        card.appendChild(thumb);
        const body = document.createElement('div');
        body.className = 'lane-body';
        body.innerHTML = `<div class="lane-date">${formatDate(post.date)}</div><h4>${escapeHtml(post.title)}</h4><p class="lane-excerpt">${escapeHtml(post.summary || '')}</p>`;
        card.appendChild(body);
        card.addEventListener('mouseenter', () => prefetchPostDetail(post));
        card.addEventListener('click', () => { openPostLightbox(post); });
        categoryGrid.appendChild(card);
      });
    }
    if (location.hash !== '#gallery/' + encodeURIComponent(catName)) {
      history.replaceState(null, '', '#gallery/' + encodeURIComponent(catName));
    }
    categoryOverlay.classList.add('open');
    lockBodyScroll();
  }
  function closeCategoryOverlay() {
    categoryOverlay.classList.remove('open');
    unlockBodyScroll();
    if (location.hash.indexOf('#gallery/') === 0) history.replaceState(null, '', location.pathname + location.search);
  }
  categoryClose.addEventListener('click', closeCategoryOverlay);
  categoryOverlay.addEventListener('click', (e) => { if (e.target === categoryOverlay) closeCategoryOverlay(); });

  document.querySelectorAll('.wall-more').forEach(btn => {
    btn.addEventListener('click', () => openCategoryOverlay(btn.getAttribute('data-cat')));
  });

  // 새로고침 없이 주소창의 #gallery/카테고리명 링크로도 바로 열리도록 함 (공유 가능한 링크)
  function handleGalleryHash() {
    const m = location.hash.match(/^#gallery\/(.+)$/);
    if (m && allPosts.length) openCategoryOverlay(decodeURIComponent(m[1]));
  }
  window.addEventListener('hashchange', handleGalleryHash);

  // ===== 검색 (홈에 이미 불러와 둔 전체 글에서 즉시 검색 — 노션에 추가로 접속하지 않음) =====
  function wireSiteSearch(inputEl, resultsEl) {
    if (!inputEl || !resultsEl) return;
    inputEl.addEventListener('input', () => {
      const q = inputEl.value.trim().toLowerCase();
      if (!q) { resultsEl.classList.remove('open'); resultsEl.innerHTML = ''; return; }
      const matched = allPosts.filter(p =>
        (p.title || '').toLowerCase().includes(q) || (p.summary || '').toLowerCase().includes(q)
      ).slice(0, 12);
      resultsEl.innerHTML = '';
      if (!matched.length) {
        resultsEl.innerHTML = '<div class="sr-empty">검색 결과가 없습니다.</div>';
      } else {
        matched.forEach(post => {
          const row = document.createElement('div');
          row.className = 'sr-row';
          const thumb = document.createElement('div');
          thumb.className = 'sr-thumb';
          if (post.images && post.images[0]) {
            const img = document.createElement('img');
            img.src = post.images[0];
            img.alt = post.title || '';
            thumb.appendChild(img);
          } else if (post.video) {
            const img = document.createElement('img');
            img.src = 'https://img.youtube.com/vi/' + post.video + '/hqdefault.jpg';
            img.alt = post.title || '';
            thumb.appendChild(img);
          }
          addVideoBadge(thumb, post);
          row.appendChild(thumb);
          const text = document.createElement('div');
          text.className = 'sr-text';
          text.innerHTML = `<strong>${escapeHtml(post.title)}</strong><span>${escapeHtml(post.category || '')} · ${formatDate(post.date)}</span>`;
          row.appendChild(text);
          row.addEventListener('click', () => { openPostLightbox(post); resultsEl.classList.remove('open'); inputEl.value = ''; });
          resultsEl.appendChild(row);
        });
      }
      resultsEl.classList.add('open');
    });
    document.addEventListener('click', (e) => {
      if (!inputEl.contains(e.target) && !resultsEl.contains(e.target)) resultsEl.classList.remove('open');
    });
  }
  wireSiteSearch(document.getElementById('siteSearchInput'), document.getElementById('siteSearchResults'));

  // ===== 게시글 상세: 동역하기 버튼 + 이어보기(다음 글 2개) =====
  const postPartnerBtn = document.getElementById('postPartnerBtn');
  if (postPartnerBtn) {
    postPartnerBtn.addEventListener('click', () => {
      postLightboxOverlay.classList.remove('open');
      unlockBodyScroll();
      donateOverlay.classList.add('open');
      lockBodyScroll();
    });
  }

  function renderPostContinue(currentPost) {
    const wrap = document.getElementById('postContinue');
    const grid = document.getElementById('postContinueGrid');
    if (!wrap || !grid) return;
    const sameCat = allPosts.filter(p => p.category === currentPost.category && p.id !== currentPost.id);
    const idx = allPosts.findIndex(p => p.id === currentPost.id);
    let nextPosts = sameCat.slice(0, 2);
    if (nextPosts.length < 2) {
      // 같은 카테고리에 더 볼 글이 부족하면 최근 다른 이야기로 이어서 채움
      const others = allPosts.filter(p => p.id !== currentPost.id && !nextPosts.includes(p));
      nextPosts = nextPosts.concat(others.slice(0, 2 - nextPosts.length));
    }
    grid.innerHTML = '';
    if (!nextPosts.length) { wrap.style.display = 'none'; return; }
    nextPosts.forEach(post => {
      const card = document.createElement('div');
      card.className = 'pc-card';
      const thumb = document.createElement('div');
      thumb.className = 'pc-thumb';
      if (post.images && post.images[0]) {
        const img = document.createElement('img');
        img.src = post.images[0];
        img.alt = post.title || '';
        thumb.appendChild(img);
      } else if (post.video) {
        const img = document.createElement('img');
        img.src = 'https://img.youtube.com/vi/' + post.video + '/hqdefault.jpg';
        img.alt = post.title || '';
        thumb.appendChild(img);
      }
      addVideoBadge(thumb, post);
      card.appendChild(thumb);
      const p = document.createElement('p');
      p.textContent = post.title || '';
      card.appendChild(p);
      card.addEventListener('mouseenter', () => prefetchPostDetail(post));
      card.addEventListener('click', () => openPostLightbox(post));
      grid.appendChild(card);
    });
    wrap.style.display = '';
  }

  function renderPrayerLetters(posts) {
    const el = document.getElementById('prayerLetterList');
    if (!el) return;
    el.innerHTML = '';
    if (!posts.length) {
      el.innerHTML = '<p class="pl-empty">아직 등록된 기도편지가 없습니다.</p>';
      return;
    }
    posts.slice(0, 8).forEach(post => {
      const row = document.createElement('div');
      row.className = 'pl-row';

      const thumb = document.createElement('div');
      thumb.className = 'pl-thumb';
      if (post.images && post.images[0]) {
        const img = document.createElement('img');
        img.src = post.images[0];
        img.alt = post.title || '';
        thumb.appendChild(img);
      }
      row.appendChild(thumb);

      const text = document.createElement('div');
      text.className = 'pl-text';
      text.innerHTML = `<strong>${escapeHtml(post.title)}</strong><span>${formatDate(post.date)}</span>`;
      row.appendChild(text);

      const arrow = document.createElement('span');
      arrow.className = 'pl-arrow';
      arrow.textContent = '→';
      row.appendChild(arrow);

      row.addEventListener('mouseenter', () => prefetchPostDetail(post));
      row.addEventListener('touchstart', () => prefetchPostDetail(post), { passive: true });
      row.addEventListener('click', () => openPostLightbox(post));
      el.appendChild(row);
    });
  }

  // progress bar animate on view
  const targetPct = 90.8;
  const fill = document.getElementById('progressFill');
  const pctNum = document.getElementById('pctNum');
  const progressObserver = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting){
        fill.style.width = targetPct + '%';
        let cur = 0;
        const step = () => {
          cur += 2;
          if (cur >= targetPct){ pctNum.textContent = targetPct + '%'; return; }
          pctNum.textContent = Math.round(cur) + '%';
          requestAnimationFrame(step);
        };
        step();
        progressObserver.unobserve(e.target);
      }
    });
  }, { threshold: 0.4 });
  progressObserver.observe(document.querySelector('.progress-card'));

  // guestbook: 저장 + 실시간 표시 (Google Sheets 백엔드 연결)
  function makeStickyNote(text, name) {
    const note = document.createElement('div');
    const colors = ['y','p','b','g'];
    note.className = 'sticky ' + colors[Math.floor(Math.random()*colors.length)];
    note.style.transform = 'rotate(' + (Math.random()*6-3).toFixed(1) + 'deg)';
    note.textContent = '"' + text + '"';
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = '— ' + name;
    note.appendChild(who);
    return note;
  }

  // 페이지를 열 때 기존에 저장된 방명록 불러오기 (예시 메시지 위에 실제 메시지를 추가로 쌓음)
  if (SUBSCRIBE_SCRIPT_URL && SUBSCRIBE_SCRIPT_URL.indexOf('PASTE_YOUR') === -1) {
    fetch(SUBSCRIBE_SCRIPT_URL + '?type=guestbook')
      .then(res => res.json())
      .then(data => {
        if (data.entries && data.entries.length) {
          const row = document.querySelector('.sticky-row');
          // 실제 메시지를 최신순으로 예시 메시지들 앞에 추가 (예시는 그대로 유지)
          data.entries.slice().reverse().forEach(entry => {
            row.prepend(makeStickyNote(entry.message, entry.name));
          });
        }
        // 방명록 참여 인원수 표시
        const gbCountEl = document.getElementById('guestbookCount');
        if (gbCountEl && data.entries) {
          gbCountEl.textContent = `지금까지 ${data.entries.length}명의 동역자님이 축복의 메시지를 남겨주셨어요 🕯️`;
        }
      })
      .catch(() => { /* 불러오기 실패 시 기존 예시 메시지를 그대로 둠 */ });
  }

  document.querySelector('.note-form button').addEventListener('click', () => {
    const textEl = document.querySelector('.note-form textarea');
    const nameEl = document.querySelector('.note-form input[type=text]');
    const text = textEl.value.trim();
    if (!text) {
      // 메시지를 안 쓰고 눌렀을 때 눈에 보이는 피드백을 줌 (조용히 무시하지 않음)
      textEl.classList.remove('shake-error');
      void textEl.offsetWidth; // 애니메이션 재시작을 위한 강제 리플로우
      textEl.classList.add('shake-error');
      textEl.focus();
      setTimeout(() => textEl.classList.remove('shake-error'), 500);
      return;
    }
    const name = nameEl.value.trim() || '익명의 동역자';

    // 1) 화면에 즉시 표시
    const row = document.querySelector('.sticky-row');
    row.prepend(makeStickyNote(text, name));
    textEl.value = '';
    nameEl.value = '';

    // 2) 실제 저장 + 알림 메일 발송
    if (SUBSCRIBE_SCRIPT_URL && SUBSCRIBE_SCRIPT_URL.indexOf('PASTE_YOUR') === -1) {
      const formData = new FormData();
      formData.append('type', 'guestbook');
      formData.append('name', name);
      formData.append('message', text);
      fetch(SUBSCRIBE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: formData
      }).catch(() => { /* 네트워크 오류가 나도 화면 표시는 이미 되어 있으므로 무시 */ });
    }
  });

  // ===== 정기후원 문의 / 사역 문의 =====
  function wireInquiryForm(config) {
    const btn = document.querySelector(`.inquiry-submit[data-type="${config.type}"]`);
    if (!btn) return;
    btn.addEventListener('click', () => {
      const orgEl = document.getElementById(config.orgId);
      const managerEl = document.getElementById(config.managerId);
      const contactEl = document.getElementById(config.contactId);
      const contentEl = document.getElementById(config.contentId);
      const noteEl = document.getElementById(config.noteId);

      const content = contentEl.value.trim();
      if (!content) {
        contentEl.classList.remove('shake-error');
        void contentEl.offsetWidth;
        contentEl.classList.add('shake-error');
        contentEl.focus();
        setTimeout(() => contentEl.classList.remove('shake-error'), 500);
        return;
      }

      const org = orgEl.value.trim();
      const manager = managerEl.value.trim();
      const contact = contactEl.value.trim();

      // 1) 화면에 즉시 표시
      noteEl.textContent = '✓ 문의가 접수되었습니다. 빠른 시일 내에 kookod@naver.com 으로 답변드리겠습니다.';
      noteEl.classList.add('confirmed');

      // 2) 이메일 발송 (Apps Script 백엔드)
      if (SUBSCRIBE_SCRIPT_URL && SUBSCRIBE_SCRIPT_URL.indexOf('PASTE_YOUR') === -1) {
        const formData = new FormData();
        formData.append('type', config.type);
        formData.append('org', org);
        formData.append('manager', manager);
        formData.append('contact', contact);
        formData.append('content', content);
        fetch(SUBSCRIBE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          body: formData
        }).catch(() => { /* 화면 표시는 이미 되어 있으므로 무시 */ });
      }

      orgEl.value = '';
      managerEl.value = '';
      contactEl.value = '';
      contentEl.value = '';
    });
  }

  wireInquiryForm({
    type: 'regular-support',
    orgId: 'supportOrg', managerId: 'supportManager', contactId: 'supportContact',
    contentId: 'supportContent', noteId: 'supportInquiryNote'
  });
  wireInquiryForm({
    type: 'ministry-inquiry',
    orgId: 'ministryOrg', managerId: 'ministryManager', contactId: 'ministryContact',
    contentId: 'ministryContent', noteId: 'ministryInquiryNote'
  });
</script>

</body>
</html>
