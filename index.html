<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김&박 선교사의 태국 선교 이야기</title>
<!-- Asynchronous Font Loading with font-display: swap to prevent render delays -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FDFCF8;
    --bg-alt: #F7F3EA;
    --navy: #0B3C4D;
    --navy-deep: #082530;
    --sky: #2E9FD6;
    --sky-soft: #E4F2FA;
    --orange: #FF9233;
    --orange-deep: #E87A1B;
    --ink: #1E2A2E;
    --ink-soft: #697779;
    --line: #E9E3D6;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* Prevents body scroll when modal is open */
  body.modal-open {
    overflow: hidden;
  }
  a { text-decoration:none; color:inherit; }
  img { max-width:100%; display:block; }
  button { font-family:inherit; }

  /* ===== Nav ===== */
  header {
    position:fixed; top:0; left:0; right:0; z-index:200;
    padding:20px 5vw;
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(8,37,48,.55);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,.14);
    transition:padding .3s ease, box-shadow .3s ease, background .3s ease;
  }
  header.scrolled {
    padding:13px 5vw;
    background:rgba(255,255,255,.94);
    border-bottom:1px solid rgba(11,60,77,.08);
    box-shadow:0 4px 24px rgba(11,60,77,.08);
  }
  .logo-text {
    font-weight:800; font-size:19px; color:#fff; letter-spacing:-.01em;
    display:flex; align-items:center; gap:10px;
  }
  header.scrolled .logo-text { color:var(--navy); }

  nav.main-nav { display:flex; align-items:center; gap:42px; }
  nav.main-nav a {
    font-size:17px; font-weight:600; color:#fff; position:relative; padding:4px 0;
  }
  header.scrolled nav.main-nav a { color:var(--navy); }
  nav.main-nav a:hover { color:var(--orange); }

  .btn-donate {
    background:var(--orange); color:#fff; padding:12px 28px; border-radius:100px;
    font-weight:700; font-size:15.5px; border:none; cursor:pointer;
  }

  /* ===== Modal & Scroll Fix ===== */
  .donate-overlay {
    position:fixed; inset:0; z-index:300; background:rgba(8,30,38,.55);
    display:flex; align-items:center; justify-content:center; padding:24px;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .donate-overlay.open { opacity:1; pointer-events:auto; }
  .donate-modal {
    background:#fff; border-radius:22px; max-width:420px; width:100%; padding:32px 28px 28px;
    box-shadow:0 30px 60px rgba(0,0,0,.3); position:relative;
    transform:translateY(16px); transition:transform .25s ease;
    /* FIX: Enable internal modal scrolling when content exceeds height */
    max-height: 85vh;
    overflow-y: auto;
  }
  .donate-overlay.open .donate-modal { transform:translateY(0); }
  .donate-close {
    position:absolute; top:18px; right:18px; width:30px; height:30px; border-radius:50%;
    border:none; background:var(--bg-alt); cursor:pointer;
  }

  /* ===== Hero Section ===== */
  .hero {
    position:relative; min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:150px 6vw 90px;
  }
  .hero-bg {
    position:absolute; inset:0; z-index:-1;
    background-color: var(--navy-deep);
  }
  .hero h1 { color:#fff; font-size:36px; margin-bottom:16px; }
</style>
</head>
<body>

<header id="mainHeader">
  <div class="logo-text">
    <a href="index.html">김&박 선교사의 태국 선교 이야기</a>
  </div>
  <!-- FIX: Separate Page Navigation Structure -->
  <nav class="main-nav">
    <a href="index.html">홈</a>
    <a href="story.html">선교 이야기</a>
    <a href="gallery.html">갤러리</a>
    <a href="news.html">소식지</a>
  </nav>
  <button class="btn-donate" onclick="toggleModal(true)">후원하기</button>
</header>

<section class="hero">
  <div class="hero-bg"></div>
  <h1>태국 땅에 전하는 소망의 메시지</h1>
</section>

<!-- Donate Modal -->
<div class="donate-overlay" id="donateModal">
  <div class="donate-modal">
    <button class="donate-close" onclick="toggleModal(false)">&times;</button>
    <h3>후원 계좌 안내</h3>
    <p class="sub">선교 사역에 동참해 주셔서 감사합니다.</p>
    <div class="donate-account">
      <span class="tag">선교후원</span>
      <div class="num">000-0000-0000-00</div>
      <div class="note">예금주: 김&박 선교사</div>
    </div>
  </div>
</div>

<script>
  function toggleModal(open) {
    const modal = document.getElementById('donateModal');
    if (open) {
      modal.classList.add('open');
      document.body.classList.add('modal-open'); // FIX: Freeze background scrolling
    } else {
      modal.classList.remove('open');
      document.body.classList.remove('modal-open');
    }
  }

  window.addEventListener('scroll', () => {
    const header = document.getElementById('mainHeader');
    if (window.scrollY > 50) {
      header.classList.add('scrolled');
    } else {
      header.classList.remove('scrolled');
    }
  });
</script>

</body>
</html>
